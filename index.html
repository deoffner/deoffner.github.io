<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Offner - Teaching Professor of Mathematical Sciences</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #222222;
            --muted-color: #666666;
            --accent-color: #900000; /* Subtle CMU Tartan Red */
            --border-color: #e5e5e5;
            --max-width: 800px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--muted-color);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav button {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            color: var(--muted-color);
            cursor: pointer;
            padding: 0.25rem 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        nav button:hover {
            color: var(--text-color);
        }

        nav button.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
            font-weight: 500;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Profile Layout */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
            .profile-image-container {
                order: -1;
            }
        }

        .profile-image-container img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            background-color: #eee;
            display: block;
        }

        .contact-list {
            list-style: none;
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .contact-list li {
            margin-bottom: 0.35rem;
        }

        .contact-list a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .contact-list a:hover {
            text-decoration: underline;
        }

        /* Typography & Content Layout */
        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        h2:first-of-type {
            margin-top: 0;
        }

        h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin
